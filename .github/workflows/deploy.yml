name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: siddak1234/snoopy-n8n
  IMAGE_TAG: 2.8.3-pdf-lib1.17.1-exceljs4.4.0

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-to: type=inline

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy to droplet via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/snoopy-n8n

            echo "Syncing repo..."
            git config --global --add safe.directory /opt/snoopy-n8n
            git pull origin main

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Saving current image digest for rollback..."
            ROLLBACK_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
              ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} 2>/dev/null || echo "")
            echo "Rollback digest: ${ROLLBACK_DIGEST:-none}"

            echo "Pulling latest image..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo "Restarting container..."
            docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo "Waiting for health check..."
            status=""
            for i in $(seq 1 20); do
              status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5678/healthz || true)
              if [ "$status" = "200" ]; then
                echo "Deploy healthy — HTTP 200"
                break
              fi
              echo "Attempt $i: HTTP $status — waiting..."
              sleep 5
            done

            if [ "$status" != "200" ]; then
              echo "DEPLOY FAILED: healthz did not return 200 after 100s"
              docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50

              if [ -n "$ROLLBACK_DIGEST" ]; then
                echo "Rolling back to $ROLLBACK_DIGEST ..."
                docker pull "$ROLLBACK_DIGEST"
                docker tag "$ROLLBACK_DIGEST" ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
                echo "Rollback complete. Verify service manually."
              else
                echo "No rollback digest available — manual intervention required."
              fi

              exit 1
            fi

            echo "Pruning old images..."
            docker image prune -f

            echo "Deploy complete."
