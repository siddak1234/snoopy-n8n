services:
  n8n:
    build: .
    image: snoopy-n8n:2.8.3-pdf-lib1.17.1
    container_name: snoopy-n8n
    ports:
      - "127.0.0.1:${N8N_PORT}:5678"
    environment:
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-}
      - NODE_FUNCTION_ALLOW_EXTERNAL=${NODE_FUNCTION_ALLOW_EXTERNAL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      # Execution data retention — prevents unbounded SQLite growth
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      # All API credentials are stored in the n8n Credentials DB (encrypted by N8N_ENCRYPTION_KEY).
      # No API keys are passed via env. GOOGLE_APPLICATION_CREDENTIALS is local-dev only (docker-compose.local.yml).
    volumes:
      - ./data:/home/node/.n8n
      # Secret mounts live in docker-compose.local.yml (local dev only). GCP: use docker-compose.gcp.yml — no JSON.
    restart: unless-stopped
