services:
  n8n:
    build: .
    image: snoopy-n8n:2.8.3-pdf-lib1.17.1
    container_name: snoopy-n8n
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-}
      - NODE_FUNCTION_ALLOW_EXTERNAL=${NODE_FUNCTION_ALLOW_EXTERNAL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      # Local JSON-key auth is configured in docker-compose.local.yml only.
      # Generic/prod paths intentionally omit GOOGLE_APPLICATION_CREDENTIALS to allow provider-default auth behavior.
      # Optional container-level POC keys — prefer n8n Credentials for per-workflow/provider keys in production.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-}
    volumes:
      - ./data:/home/node/.n8n
      # Secret mounts live in docker-compose.local.yml (local dev only). GCP: use docker-compose.gcp.yml — no JSON.
    restart: unless-stopped
